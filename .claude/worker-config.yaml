# Worker configuration for CLAUDE WORKER
# Safe, optimal defaults. Override with env vars or by editing this file.

# If true, the worker will pass the recommended_engine as --model to the claude CLI.
auto_inject_model: true

# If true, the worker will auto-confirm startup warnings (useful for CI).
auto_confirm_warnings: false

# Log file path for engine decisions. Defaults to the worker state dir when empty.
engine_log_path: ""
